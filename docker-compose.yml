# ─────────────────────────────────────────────────────────────────────────────
# ThreatAtlas — Docker Compose
#
# Three services:
#   redis  — Redis 7 job queue + result store
#   api    — Express proxy server + scan queue endpoints (port 3000)
#   worker — BullMQ worker process (file scan jobs)
#
# Usage:
#   docker-compose up --build          # first run
#   docker-compose up -d               # background mode
#   docker-compose logs -f worker      # watch worker logs
#   docker-compose down                # stop all services
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: threatatlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-net

  # ─── API Server ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: threatatlas-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - VT_API_KEY=${VT_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/scan/queue-health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - atlas-net
    labels:
      com.threatatlas.service: "api"
      com.threatatlas.version: "2.0"

  # ─── BullMQ Worker ────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: threatatlas-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - VT_API_KEY=${VT_API_KEY}
      # Worker does not need Gemini/Groq — only VT API for file scanning
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - atlas-net
    labels:
      com.threatatlas.service: "worker"
      com.threatatlas.version: "2.0"
    # Scale workers horizontally:  docker-compose up --scale worker=3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

volumes:
  redis-data:
    driver: local

networks:
  atlas-net:
    driver: bridge
